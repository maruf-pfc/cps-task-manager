name: Docker Image CI

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine Docker Image Tag
        id: docker_meta
        run: |
          USERNAME="${{ secrets.DOCKER_USERNAME }}"
          if [ -z "$USERNAME" ]; then
            USERNAME="marufpfc"
          fi
          echo "IMAGE_API=${USERNAME}/cps-task-manager-api:latest" >> $GITHUB_ENV
          echo "IMAGE_DASHBOARD=${USERNAME}/cps-task-manager-dashboard:latest" >> $GITHUB_ENV

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request' && secrets.DOCKER_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Server Image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile
          push: ${{ github.event_name != 'pull_request' && secrets.DOCKER_USERNAME != '' }}
          tags: ${{ env.IMAGE_API }}

      - name: Build Client Image
        uses: docker/build-push-action@v5
        with:
          context: ./client
          file: ./client/Dockerfile
          push: ${{ github.event_name != 'pull_request' && secrets.DOCKER_USERNAME != '' }}
          tags: ${{ env.IMAGE_DASHBOARD }}
